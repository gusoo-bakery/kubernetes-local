---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      initContainers:
      - name: wait-postgresql
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgresql -U gestion_presence 2>/dev/null; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      containers:
      - name: app
        image: gestion-rh:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: db-password
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: django-secret-key
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: admin-password
        envFrom:
        - configMapRef:
            name: app-config
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - name: media
          mountPath: /app/media
        - name: static
          mountPath: /app/staticfiles
        readinessProbe:
          httpGet:
            path: /login/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /login/
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: app-media
      - name: static
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: web-app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
